<!doctype html>
<html lang="en">

    <title>Techlife — Public timeline</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="app-shell">
    <main class="page">
      <section class="card stack">
        <p class="eyebrow">Public timeline</p>
        <h1 id="share-title">My Technology Life</h1>

          <h2>Overview</h2>
          <div id="share-stats" class="stats-grid"></div>
        </div>
        <div class="card stack">
          <h2>Timeline</h2>
          <div id="share-timeline" class="timeline-list"></div>
        </div>
      </section>
    </main>

    <script src="/share.js" defer></script>
